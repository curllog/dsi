name: release

# Build and publish dsi binaries to a GitHub Release whenever a vX.Y.Z tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Each target is packaged as dsi-{rid}.tar.gz (+ a matching .sha256), where {rid}
# is exactly what Platform::rid() emits in src/platform.rs. This convention is
# shared by install.sh and the future `dsi selfupdate`, so keep them in sync.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/update the GitHub Release

jobs:
  # Guard: the pushed tag must match the version in Cargo.toml, otherwise the
  # published binaries would report a different --version than the release name.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag  Cargo.toml=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - rid: linux-musl-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - rid: linux-musl-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - rid: osx-x64
            target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - rid: osx-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="dsi-${{ matrix.rid }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" dsi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          ls -l "$archive" "$archive.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dsi-${{ matrix.rid }}.tar.gz
            dsi-${{ matrix.rid }}.tar.gz.sha256
